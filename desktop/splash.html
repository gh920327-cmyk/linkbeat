<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LINKBEAT</title>
<style>
  :root { --bg:#05060d; --fg:#eef3ff; --dim:#8a93ad; --blue:#3f8cff; --cyan:#4de1ff; --gold:#ffc83d; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; overflow:hidden; user-select:none; -webkit-app-region:drag; }
  .wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; box-sizing:border-box;
    background:radial-gradient(ellipse at 50% 62%, rgba(63,140,255,.18), rgba(255,200,61,.06) 40%, transparent 70%); border:1px solid #1c2344; }
  img { width:88px; height:88px; filter:drop-shadow(0 0 18px rgba(77,225,255,.35)); animation:pulse 1.1s ease-in-out infinite; }
  h1 { margin:6px 0 0; font-size:28px; letter-spacing:6px; font-weight:900; font-style:italic; transform:skewX(-8deg);
    background:linear-gradient(90deg,var(--cyan),#fff 50%,var(--gold)); -webkit-background-clip:text; color:transparent; }
  #m { font-size:13px; color:var(--dim); min-height:18px; }
  .bar { width:180px; height:3px; background:#141a33; overflow:hidden; border-radius:2px; }
  .bar i { display:block; width:40%; height:100%; background:linear-gradient(90deg,transparent,var(--cyan),transparent); animation:run 1.2s linear infinite; }
  .x { position:absolute; top:6px; right:8px; -webkit-app-region:no-drag; background:none; border:0; color:#4a5378; font-size:14px; cursor:pointer; padding:4px 6px; }
  .x:hover { color:#eef3ff; }
  #m { max-width:440px; text-align:center; line-height:1.5; }
  .ver { position:absolute; right:10px; bottom:8px; font-size:11px; color:#3a4266; }
  @keyframes run { from { transform:translateX(-100%);} to { transform:translateX(260%);} }
  @keyframes pulse { 0%,100% { transform:scale(1);} 50% { transform:scale(1.05);} }
</style>
</head>
<body>
<div class="wrap">
  <img src="icon.png" alt="">
  <h1>LINKBEAT</h1>
  <div class="bar"><i></i></div>
  <div id="m">서버에 연결하는 중…</div>
</div>
<div class="ver" id="v"></div>
<button class="x" onclick="window.close()" title="닫기">✕</button>
<script>
  function setMsg(t){ document.getElementById('m').textContent = t; }
  const v = new URLSearchParams(location.search).get('v'); if (v) document.getElementById('v').textContent = 'v' + v;
</script>
</body>
</html>
